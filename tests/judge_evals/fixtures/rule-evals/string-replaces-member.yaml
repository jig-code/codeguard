cases:
  - name: passes a string
    inputs:
      file: status.py
      before: |
        ship(status=Status.SHIPPED)
      after: |
        ship(status='shipped')
    expected_output: {outcome: invalid}
  - name: passes the member
    inputs:
      file: status.py
      after: |
        ship(status=Status.SHIPPED)
    expected_output: {outcome: valid}
