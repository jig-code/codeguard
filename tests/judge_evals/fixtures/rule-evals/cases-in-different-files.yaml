cases:
  - name: passes a string
    inputs:
      file: shipping/ship.py
      after: |
        ship(status='shipped')
      unchanged:
        shipping/__init__.py: |
          from shipping.status import Status
    expected_output: {outcome: invalid, reason: The call passes a string.}
  - name: passes the member
    inputs:
      file: cancelling.py
      after: |
        cancel(status=Status.CANCELLED)
    expected_output: {outcome: valid, reason: The call passes the member.}
