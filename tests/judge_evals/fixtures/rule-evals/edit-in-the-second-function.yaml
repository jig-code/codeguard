cases:
  - name: passes a string
    inputs:
      file: status.py
      before: |
        def ship_order():
            ship(status=Status.SHIPPED)


        def cancel_order():
            cancel(status=Status.CANCELLED)
      after: |
        def ship_order():
            ship(status=Status.SHIPPED)


        def cancel_order():
            cancel(status='cancelled')
    expected_output: {outcome: invalid}
