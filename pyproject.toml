[project]
name = "codeguard"
version = "0.11.0"
description = "Runs a project's own rules on its changed files, at agent Stop and in CI."
authors = [
    { name = "Craig Israel", email = "craig@theisraels.net" }
]
requires-python = ">=3.13"
dependencies = [
    "ast-grep-cli>=0.45.3",
    "diskcache>=5.6.3",
    "google-genai>=2.28.0",
    "logfire>=5.2.0",
    "packaging>=26.3",
    "pydantic>=2.13.5",
    "pydantic-ai-slim[bedrock,google]~=2.66.0",
    "pydantic-evals~=2.66.0",
    "pydantic-settings>=2.12",
    "pygit2>=1.21.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
codeguard = "codeguard.cli:main"

[build-system]
requires = ["uv_build>=0.10.11,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--import-mode=importlib", "-m", "not llm"]
markers = ["llm: exercises the review pipeline with a real judge using the fixture bindings or provider/model overrides; run with pytest -m llm"]

[tool.ruff]
line-length = 100
target-version = "py313"
# The writing-rules eval cases keep the defects their tasks are about.
extend-exclude = ["evals/writing-rules", "evals-pending"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "SIM",
    "UP",
    "C4",
    "C90",
    "PGH003",
    "PLR0913",
    "PLR0915",
    "PLC0415",
    "T20",
    "TID251",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "codeguard.config.JudgeChoice",
    "codeguard.config.RulesetConfig",
    "codeguard.judge_evals.EvalSelection",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.TYPE_CHECKING".msg = "Do not use TYPE_CHECKING. Fix the import cycle."

[tool.basedpyright]
include = ["src"]
typeCheckingMode = "standard"
reportExplicitAny = "error"
reportMissingTypeArgument = "error"
reportUnnecessaryIsInstance = "error"
reportUnnecessaryComparison = "error"

[tool.importlinter]
root_packages = ["codeguard"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "codeguard packages depend one way"
type = "layers"
containers = ["codeguard"]
exhaustive = true
layers = [
    "cli",
    "rules",
    "claude_provider | codex_provider | gemini_provider | judge_evals",
    "pattern_rules",
    "rule_tests",
    "review | packages",
    "syntax",
    "ast_grep",
    "config | repository | file_lock",
    "line_range",
]

[[tool.importlinter.contracts]]
name = "the repository package depends one way"
type = "layers"
containers = ["codeguard.repository"]
exhaustive = true
layers = [
    "line_scope",
    "working_tree_diff | working_tree",
    "file_diff | git",
]

[[tool.importlinter.contracts]]
name = "only the repository package runs git"
type = "protected"
protected_modules = ["codeguard.repository.git"]
allowed_importers = ["codeguard.repository"]

[[tool.importlinter.contracts]]
name = "only judge_evals runs pydantic-evals"
type = "forbidden"
source_modules = [
    "codeguard.cli",
    "codeguard.rules",
    "codeguard.claude_provider",
    "codeguard.codex_provider",
    "codeguard.gemini_provider",
    "codeguard.pattern_rules",
    "codeguard.rule_tests",
    "codeguard.review",
    "codeguard.packages",
    "codeguard.syntax",
    "codeguard.ast_grep",
    "codeguard.config",
    "codeguard.repository",
    "codeguard.line_range",
    "codeguard.file_lock",
]
forbidden_modules = ["pydantic_evals"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "only the repository package runs libgit2"
type = "forbidden"
source_modules = [
    "codeguard.cli",
    "codeguard.rules",
    "codeguard.claude_provider",
    "codeguard.codex_provider",
    "codeguard.gemini_provider",
    "codeguard.judge_evals",
    "codeguard.pattern_rules",
    "codeguard.rule_tests",
    "codeguard.review",
    "codeguard.packages",
    "codeguard.syntax",
    "codeguard.ast_grep",
    "codeguard.config",
    "codeguard.line_range",
    "codeguard.file_lock",
]
forbidden_modules = ["pygit2"]
allow_indirect_imports = true

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "factory-boy>=3.3.3",
    "import-linter>=2.15",
    "pytest>=9.1.1",
    "pytest-factoryboy>=2.8.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.1",
]
