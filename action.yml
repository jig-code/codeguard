name: codeguard
description: Check a pull request's changed files against the project's rules, and run the rule tests.
inputs:
  base:
    description: Ref the changes are compared against. The checkout needs its history (fetch-depth 0).
    default: origin/${{ github.base_ref }}
  packages-token:
    description: GitHub token that can read the project's private rule packages.
    required: false
  logfire-token:
    description: Logfire write token. When set, codeguard sends a trace of each run, with each judge call's tokens, cost and duration.
    required: false
  eval:
    description: Also run `codeguard eval`, which calls the judge the job's environment names for each judge rule case.
    default: 'false'
  dry-run:
    description: Run the pattern rules and list the judge calls the review would make, without calling a model. Fails only on pattern rule errors.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v10.2.0
    - name: Authenticate rule package fetches
      if: inputs.packages-token != ''
      shell: bash
      run: git config --global url."https://x-access-token:${PACKAGES_TOKEN}@github.com/".insteadOf "https://github.com/"
      env:
        PACKAGES_TOKEN: ${{ inputs.packages-token }}
    - name: Check changed files
      id: review
      shell: bash
      run: |
        limit=$(uv run --frozen --project "${{ github.action_path }}" codeguard config review_time_limit_minutes)
        judge_errors=()
        if [ "$ALLOW_JUDGE_ERRORS" = true ]; then
          judge_errors=(--judge-errors-as-warnings)
        fi
        timeout "$((limit + 2))m" uv run --frozen --project "${{ github.action_path }}" codeguard review --base "${{ inputs.base }}" ${{ inputs.dry-run == 'true' && '--dry-run' || '' }} "${judge_errors[@]}"
      env:
        ALLOW_JUDGE_ERRORS: ${{ contains(github.event.pull_request.labels.*.name, 'codeguard-allow-judge-errors') }}
        LOGFIRE_TOKEN: ${{ inputs.logfire-token }}
    - name: Point to the plugin
      if: failure() && steps.review.outcome == 'failure'
      shell: bash
      run: echo "::error::Install the codeguard plugin so your agent catches these before you push. See https://github.com/jig-code/codeguard#setup"
    - name: Test rules
      shell: bash
      run: uv run --frozen --project "${{ github.action_path }}" codeguard test
    - name: Evaluate judge rules
      if: inputs.eval == 'true'
      shell: bash
      run: uv run --frozen --project "${{ github.action_path }}" codeguard eval
      env:
        LOGFIRE_TOKEN: ${{ inputs.logfire-token }}
