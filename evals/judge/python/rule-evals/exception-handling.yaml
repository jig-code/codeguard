cases:
  - name: a handler that discards its exception
    inputs:
      file: payments/charge.py
      after: |
        def charge(gateway, amount: int) -> None:
            try:
                gateway.charge(amount)
            except Exception:
                pass
    expected_output:
      outcome: invalid
  - name: a handler that logs and re-raises its exception
    inputs:
      file: payments/refund.py
      after: |
        import logging

        logger = logging.getLogger(__name__)


        def refund(gateway, amount: int) -> None:
            try:
                gateway.refund(amount)
            except gateway.Error:
                logger.exception("Refund failed")
                raise
    expected_output:
      outcome: valid
  - name: an edit that changes no control flow
    inputs:
      file: payments/charge.py
      before: |
        RETRIES = 1
      after: |
        RETRIES = 2
    expected_output:
      outcome: skipped
  - name: an edit to the clause of a handler that already discarded its exception
    inputs:
      file: payments/charge.py
      before: |
        def charge(gateway, amount: int) -> None:
            try:
                gateway.charge(amount)
            except:
                pass
      after: |
        def charge(gateway, amount: int) -> None:
            try:
                gateway.charge(amount)
            except Exception:
                pass
    expected_output:
      outcome: invalid
  - name: an edit to a call in a try block whose untouched handler discards its exception
    inputs:
      file: payments/charge.py
      before: |
        def charge(gateway, amount: int) -> None:
            try:
                gateway.charge(amount)
            except Exception:
                pass
      after: |
        def charge(gateway, amount: int) -> None:
            try:
                gateway.charge(amount, currency="EUR")
            except Exception:
                pass
    expected_output:
      outcome: valid
  - name: an edit to a condition in a function whose untouched handler discards its exception
    inputs:
      file: payments/charge.py
      before: |
        def charge(gateway, amount: int) -> None:
            if amount <= 0:
                return
            try:
                gateway.charge(amount)
            except Exception:
                pass
      after: |
        def charge(gateway, amount: int) -> None:
            if amount < 0:
                return
            try:
                gateway.charge(amount)
            except Exception:
                pass
    expected_output:
      outcome: valid
  - name: a re-raising handler added beside a function that discards its exception
    inputs:
      file: payments/gateway.py
      before: |
        import logging

        logger = logging.getLogger(__name__)


        def charge(gateway, amount: int) -> None:
            try:
                gateway.charge(amount)
            except Exception:
                pass


        def refund(gateway, amount: int) -> None:
            gateway.refund(amount)
      after: |
        import logging

        logger = logging.getLogger(__name__)


        def charge(gateway, amount: int) -> None:
            try:
                gateway.charge(amount)
            except Exception:
                pass


        def refund(gateway, amount: int) -> None:
            try:
                gateway.refund(amount)
            except gateway.Error:
                logger.exception("Refund failed")
                raise
    expected_output:
      outcome: valid
  - name: removing the logging that kept a handler from discarding its exception
    inputs:
      file: payments/refund.py
      before: |
        import logging

        logger = logging.getLogger(__name__)


        def refund(gateway, metrics, amount: int) -> None:
            try:
                gateway.refund(amount)
            except gateway.Error:
                metrics.increment("refund.failed")
                logger.exception("Refund failed")
      after: |
        import logging

        logger = logging.getLogger(__name__)


        def refund(gateway, metrics, amount: int) -> None:
            try:
                gateway.refund(amount)
            except gateway.Error:
                metrics.increment("refund.failed")
    expected_output:
      outcome: invalid
  - name: removing a metric from a handler that still logs its exception
    inputs:
      file: payments/refund.py
      before: |
        import logging

        logger = logging.getLogger(__name__)


        def refund(gateway, metrics, amount: int) -> None:
            try:
                gateway.refund(amount)
            except gateway.Error:
                metrics.increment("refund.failed")
                logger.exception("Refund failed")
      after: |
        import logging

        logger = logging.getLogger(__name__)


        def refund(gateway, metrics, amount: int) -> None:
            try:
                gateway.refund(amount)
            except gateway.Error:
                logger.exception("Refund failed")
    expected_output:
      outcome: valid
  - name: a handler that passes its exception to a logging function earlier in its file
    inputs:
      file: shipping/labels.py
      before: |
        import logging

        logger = logging.getLogger(__name__)


        def record_failure(error: Exception) -> None:
            logger.error("Label printing failed", exc_info=error)


        def print_label(printer, parcel) -> None:
            printer.print(parcel.address)
      after: |
        import logging

        logger = logging.getLogger(__name__)


        def record_failure(error: Exception) -> None:
            logger.error("Label printing failed", exc_info=error)


        def print_label(printer, parcel) -> None:
            try:
                printer.print(parcel.address)
            except printer.Error as error:
                record_failure(error)
    expected_output:
      outcome: valid
  - name: a handler that passes its exception to a logging function in another module
    inputs:
      file: shipping/dispatch.py
      after: |
        from shipping.failures import record_failure


        def dispatch(courier, parcel) -> None:
            try:
                courier.collect(parcel)
            except courier.Error as error:
                record_failure(error)
      unchanged:
        shipping/__init__.py: ''
        shipping/failures.py: |
          import logging

          logger = logging.getLogger(__name__)


          def record_failure(error: Exception) -> None:
              logger.error("Dispatch failed", exc_info=error)
    expected_output:
      outcome: valid
