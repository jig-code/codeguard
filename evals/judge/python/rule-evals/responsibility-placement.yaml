  - name: allows a function calling the type's method added beside one that recomputes
    inputs:
      file: orders/receipt.py
      before: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Line:
            price: int
            quantity: int

            def amount(self) -> int:
                return self.price * self.quantity


        @dataclass(frozen=True)
        class Order:
            lines: tuple[Line, ...]

            def total(self) -> int:
                return sum(line.amount() for line in self.lines)


        @dataclass(frozen=True)
        class Customer:
            name: str

            def greeting(self, salutation: str) -> str:
                return f"{salutation} {self.name}"


        def invoice_amount(order: Order) -> int:
            return sum(line.price * line.quantity for line in order.lines)
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Line:
            price: int
            quantity: int

            def amount(self) -> int:
                return self.price * self.quantity


        @dataclass(frozen=True)
        class Order:
            lines: tuple[Line, ...]

            def total(self) -> int:
                return sum(line.amount() for line in self.lines)


        @dataclass(frozen=True)
        class Customer:
            name: str

            def greeting(self, salutation: str) -> str:
                return f"{salutation} {self.name}"


        def invoice_amount(order: Order) -> int:
            return sum(line.price * line.quantity for line in order.lines)


        def receipt(customer: Customer, order: Order) -> str:
            return f"{customer.greeting('Dear')}: {order.total()}"
    expected_output:
      outcome: valid
