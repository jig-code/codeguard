cases:
  - name: flags code that recomputes another type's data
    inputs:
      file: orders/invoice.py
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Line:
            price: int
            quantity: int

            def amount(self) -> int:
                return self.price * self.quantity


        @dataclass(frozen=True)
        class Order:
            lines: tuple[Line, ...]

            def total(self) -> int:
                return sum(line.amount() for line in self.lines)


        def invoice_amount(order: Order) -> int:
            return sum(line.price * line.quantity for line in order.lines)
    expected_output:
      outcome: invalid
  - name: allows a call to the type's method
    inputs:
      file: orders/receipt.py
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Line:
            price: int
            quantity: int

            def amount(self) -> int:
                return self.price * self.quantity


        @dataclass(frozen=True)
        class Order:
            lines: tuple[Line, ...]

            def total(self) -> int:
                return sum(line.amount() for line in self.lines)


        def receipt(customer_name: str, order: Order) -> str:
            return f"{customer_name}: {order.total()}"
    expected_output:
      outcome: valid
  - name: allows an edit to a method call in a function whose untouched line recomputes another type's data
    inputs:
      file: orders/letter.py
      before: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Line:
            price: int
            quantity: int

            def amount(self) -> int:
                return self.price * self.quantity


        @dataclass(frozen=True)
        class Order:
            lines: tuple[Line, ...]

            def total(self) -> int:
                return sum(line.amount() for line in self.lines)


        @dataclass(frozen=True)
        class Customer:
            name: str

            def greeting(self, salutation: str) -> str:
                return f"{salutation} {self.name}"


        def letter(customer: Customer, order: Order) -> list[str]:
            greeting = customer.greeting("Dear")
            amount = sum(line.price * line.quantity for line in order.lines)
            return [greeting, str(amount)]
      after: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Line:
            price: int
            quantity: int

            def amount(self) -> int:
                return self.price * self.quantity


        @dataclass(frozen=True)
        class Order:
            lines: tuple[Line, ...]

            def total(self) -> int:
                return sum(line.amount() for line in self.lines)


        @dataclass(frozen=True)
        class Customer:
            name: str

            def greeting(self, salutation: str) -> str:
                return f"{salutation} {self.name}"


        def letter(customer: Customer, order: Order) -> list[str]:
            greeting = customer.greeting("Hello")
            amount = sum(line.price * line.quantity for line in order.lines)
            return [greeting, str(amount)]
    expected_output:
      outcome: valid
