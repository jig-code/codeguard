cases:
  - name: logging a password
    inputs:
      file: src/shop/accounts.py
      after: |
        import logging

        logger = logging.getLogger(__name__)


        def sign_in(email, password):
            logger.info("sign-in attempt for %s with %s", email, password)
    expected_output:
      outcome: invalid
  - name: logging an access token
    inputs:
      file: src/shop/payments.py
      after: |
        import logging

        logger = logging.getLogger(__name__)


        def refund(order, access_token):
            logger.debug("refunding %s with token %s", order.id, access_token)
    expected_output:
      outcome: invalid
  - name: logging a session cookie
    inputs:
      file: src/shop/sessions.py
      after: |
        import logging

        logger = logging.getLogger(__name__)


        def resume(request):
            logger.info("resuming session %s", request.cookies["session"])
    expected_output:
      outcome: invalid
  - name: logging a user's id
    inputs:
      file: src/shop/accounts.py
      after: |
        import logging

        logger = logging.getLogger(__name__)


        def sign_out(user):
            logger.info("user %s signed out", user.id)
    expected_output:
      outcome: valid
