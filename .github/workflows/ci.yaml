name: codeguard CI
on:
  push:
    branches: [main]
    paths-ignore: &docs [docs/**, README.md, CLAUDE.md]
  pull_request:
    paths-ignore: *docs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: .github/scripts/check-versions.sh
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv run --frozen ruff check
      - run: uv run --frozen ruff format --check
      - run: uv run --frozen pytest
      - run: uv run --frozen lint-imports
      - run: uv run --frozen basedpyright
  codeguard-rules:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./
        with:
          logfire-token: ${{ secrets.LOGFIRE_TOKEN }}
          dry-run: true
  # One run of each fixture case verifies the change, stopping at the first failure.
  llm-tests-validity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}
      - uses: astral-sh/setup-uv@v10.2.0
      # Each worker makes 2 Gemini calls at once, which keeps the run under Vertex's
      # tokens-per-minute limit.
      - run: uv run --frozen pytest -m llm -n 4 --llm-runs 1 -x
        env:
          CODEGUARD_JUDGE__GEMINI__PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
          CODEGUARD_JUDGE__GEMINI__CREDENTIALS_FILE: ${{ steps.auth.outputs.credentials_file_path }}
  # Two more runs of each case, for 3 of 3; every run completes.
  llm-tests-reliability:
    needs: llm-tests-validity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv run --frozen pytest -m llm -n 4 --llm-runs 2
        env:
          CODEGUARD_JUDGE__GEMINI__PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
          CODEGUARD_JUDGE__GEMINI__CREDENTIALS_FILE: ${{ steps.auth.outputs.credentials_file_path }}
