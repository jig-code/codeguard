name: writing-rules skill evals
on:
  pull_request:
    paths:
      - skills/writing-rules/**
      - evals/writing-rules/**
      - .github/workflows/skill-evals.yaml
      - .github/workflows/skill-evals-run.yaml
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
# Each cost ceiling is about three times the pass's cost in the last green run, so a
# runaway agent stops the paid run; raise them when cases move back from evals-pending/.
jobs:
  validity:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/skill-evals-run.yaml
    with:
      pass: validity
      runs: 1
      max-cost-usd: 1
      timeout-minutes: 30
  reliability:
    needs: validity
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/skill-evals-run.yaml
    with:
      pass: reliability
      runs: 9
      max-cost-usd: 8
      timeout-minutes: 90
