name: writing-rules skill evals
on:
  pull_request:
    paths: [skills/writing-rules/**, evals/writing-rules/**]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # One run of every case verifies the change.
  skill-evals-validity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npm install --global @anthropic-ai/claude-code
      - run: claude plugin eval . --scaffold --allow-tools Write Edit --runs 1 --threshold 1 --trust-plugin --no-publish
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
  # Nine more runs of every case, for 10 of 10; every run completes.
  skill-evals-reliability:
    needs: skill-evals-validity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npm install --global @anthropic-ai/claude-code
      - run: claude plugin eval . --scaffold --allow-tools Write Edit --runs 9 --threshold 1 --trust-plugin --no-publish
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
