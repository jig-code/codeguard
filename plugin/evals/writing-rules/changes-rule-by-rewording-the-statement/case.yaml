schema_version: "1.1"
name: changes-rule-by-rewording-the-statement
expected_outcome: |
  The agent loads the writing-rules skill. The rule file, .codeguard/rules/judge/no-swallowed-exceptions.md, holds, in this order and with no other heading: a `#` title, the statement directly under it, and a `## Why` section with text.
  The statement is one declarative sentence, and states one convention with no clause for code that convention doesn't decide. Whether code keeps or breaks the statement can be decided from the changed code and the code around it. The statement uses only plain, clear words. The statement says what code must never do, once, exempts none of that code, and names what that code has in common rather than particular things.
  The statement says nothing about how code avoids what the statement forbids, and the statement gives no why.
  The statement writes every relative pronoun that a phrase needs, and no pronoun in the statement could mean more than one noun.
context:
  scaffold_script: place-files.sh
