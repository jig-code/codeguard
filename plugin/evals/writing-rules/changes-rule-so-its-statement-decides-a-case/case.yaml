schema_version: "1.1"
name: changes-rule-so-its-statement-decides-a-case
expected_outcome: |
  The agent loads the writing-rules skill. The rule's file, .codeguard/rules/judge/no-secrets-in-logs.md, holds a title, one statement and a `## Why`, and no other section.
  The statement is one declarative sentence, not a question or a command. The statement uses only common terms. The statement is a negative sentence, and states what it forbids once. The statement states one intent, not a list of code shapes, values or names.
  The statement says nothing about how code avoids what the statement forbids, and the statement gives no why. The statement names nothing that code leaves out.
  The statement writes every relative pronoun that a phrase needs, and no pronoun in the statement could mean more than one noun.
  A reader of the statement alone can tell whether code that writes a session cookie to a log keeps or breaks the statement.
context:
  scaffold_script: place-files.sh
