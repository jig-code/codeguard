schema_version: "1.1"
name: changes-rule-so-its-statement-decides-a-case
expected_outcome: |
  The agent loads the writing-rules skill. In the rule's file, .codeguard/rules/judge/no-swallowed-exceptions.md, the statement is the sentence under the title.
  The statement is one declarative sentence, not a question or a command, and states one convention with no clause for code that convention doesn't decide. Whether code keeps or breaks the statement can be decided from the changed code and the code around it. The statement uses only plain, clear words. The statement states what code must never do, once, and names what that code has in common rather than a list.
  The statement says nothing about how code avoids what the statement forbids, and the statement gives no why.
  The statement writes every relative pronoun that a phrase needs, and no pronoun in the statement could mean more than one noun.
  A reader of the statement alone can tell that a handler that catches `Exception`, logs the error and re-raises it keeps the statement.
context:
  scaffold_script: place-files.sh
