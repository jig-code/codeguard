schema_version: "1.1"
name: writes-rule-file-with-only-title-statement-and-why
expected_outcome: |
  The agent loads the writing-rules skill. The judge rule file holds, in this order, and no other heading: a `#` title,
  the statement directly under it, and a `## Why` section with text.
  The statement is one declarative sentence, not a question or a command, and states one convention with no clause for code that convention doesn't decide. Whether code keeps or breaks the statement can be decided from the changed code and the code around it. The statement uses only plain, clear words. The statement states what code must never do, once, and names what that code has in common rather than particular things.
  The statement says nothing about how code avoids what the statement forbids, and the statement gives no why.
  The statement writes every relative pronoun that a phrase needs, and no pronoun in the statement could mean more than one noun.
context:
  scaffold_script: place-files.sh
